<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Spendly - offline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
    background: #09090b;
    color: #ececf1;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 360px; }
  svg { display: block; margin: 0 auto 20px; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  p { margin: 0 0 24px; color: #a1a1aa; font-size: 15px; line-height: 1.5; }
  button {
    height: 44px;
    padding: 0 24px;
    border: 0;
    border-radius: 12px;
    background: #f4f4f5;
    color: #09090b;
    font: inherit;
    font-weight: 600;
    font-size: 14.5px;
  }
</style>
</head>
<body>
<main>
  <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#a5b4fc"/>
        <stop offset="1" stop-color="#6366f1"/>
      </linearGradient>
    </defs>
    <rect width="32" height="32" rx="9" fill="url(#g)"/>
    <rect x="8" y="16" width="3.6" height="8" rx="1.8" fill="#0b0b10"/>
    <rect x="14.2" y="11" width="3.6" height="13" rx="1.8" fill="#0b0b10"/>
    <rect x="20.4" y="7" width="3.6" height="17" rx="1.8" fill="#0b0b10"/>
  </svg>
  <h1>You're offline</h1>
  <p>Spendly needs a connection to load and save your expenses. Your data is not stored on this device, so nothing is lost. Reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener("online", function () { location.reload(); });</script>
</body>
</html>
